name: XAUUSD Signal Bot

on:
  schedule:
    - cron: '0 4,10,16,22 * * *'  # Restart at 5am, 11am, 5pm, 11pm BST (avoids 9am signal window)
  workflow_dispatch:          # Allows manual start from GitHub

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # Runs for ~6 hours then restarts

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_GROUP_IDS: ${{ secrets.TELEGRAM_GROUP_IDS }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
          FORCE_MIN_UNITS: ${{ secrets.FORCE_MIN_UNITS }}
