name: XAUUSD Signal Bot

on:
  schedule:
    - cron: '0 7,12 * * 1-5'      # Weekdays only: 8am and 1pm BST (7am/12pm UTC), covers 8am–4pm signal window
  workflow_dispatch:          # Allows manual start from GitHub

concurrency:
  group: xauusd-bot          # only one instance runs at a time
  cancel-in-progress: false  # let the current run finish, queue the new one

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360     # hard safety-net; bot exits cleanly at 330 min

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot
        run: python main.py
        env:
          OANDA_API_KEY: ${{ secrets.OANDA_API_KEY }}
          OANDA_ACCOUNT_ID: ${{ secrets.OANDA_ACCOUNT_ID }}
          OANDA_ENV: ${{ secrets.OANDA_ENV }}
          TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
          TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
          TELEGRAM_PHONE: ${{ secrets.TELEGRAM_PHONE }}
          TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
          TELEGRAM_GROUP_IDS: ${{ secrets.TELEGRAM_GROUP_IDS }}
          RISK_PCT: ${{ secrets.RISK_PCT }}
          FORCE_MIN_UNITS: ${{ secrets.FORCE_MIN_UNITS }}
          NOTIFY_CHAT_ID: ${{ secrets.NOTIFY_CHAT_ID }}
